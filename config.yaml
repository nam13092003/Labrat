# Cấu hình chung cho Labrat.
# Mỗi cuộc thi có thêm competitions/<slug>/project.yaml để ghi đè các giá trị dưới đây.

kaggle:
  # Tài khoản Kaggle khai báo trong .env (KAGGLE_ACCOUNTS=...). Dòng dưới chỉ dùng khi chạy 1 tài khoản
  # theo kiểu cũ (~/.kaggle/kaggle.json, không đặt KAGGLE_ACCOUNTS).
  username: "your-kaggle-username"
  # "NvidiaTeslaT4" = GPU T4 x2 trên Kaggle. Runner tự kiểm tra số GPU thực nhận
  # và ghi vào metrics.json; nếu chỉ thấy 1 GPU, agent sẽ được cảnh báo.
  accelerator: "NvidiaTeslaT4"
  enable_internet: true          # không nộp bài nên bật để pip install / tải pretrained
  max_runtime_hours: 9           # trần an toàn cho 1 phiên GPU (Kaggle: 9–12h tùy nguồn)
  quick_max_hours: 1.5           # trần của `labrat push --quick` (bản rẻ trên GPU để sàng lọc ý tưởng)
  safety_margin_minutes: 20      # runner báo deadline sớm hơn để kịp lưu checkpoint
  title_prefix: "labrat"            # tiền tố tên kernel trên Kaggle

budget:
  weekly_gpu_hours: 30           # quota tuần MỖI tài khoản Kaggle (reset 00:00 UTC thứ Bảy)
  project_gpu_hours: 20          # trần GPU cho MỘT dự án, cộng trên mọi tài khoản (ghi đè trong project.yaml)
  reserve_hours: 1.0             # mỗi tài khoản luôn chừa lại, không bao giờ tiêu
  startup_overhead_hours: 0.05   # cộng thêm mỗi lần chạy (khởi động container)
  phases:                        # phân bổ ngân sách theo giai đoạn (tỉ lệ của project_gpu_hours)
    explore: 0.2                 # baseline + EDA/phân tích lỗi + thử các hướng có căn cứ
    exploit: 0.6                 # đào sâu cơ chế của các hướng hiệu quả
    final: 0.2                   # hợp nhất các ý tưởng đã kiểm chứng, ablation, chạy dài cấu hình tốt nhất

research:                        # chính sách nghiên cứu (labrat/policy.py)
  enforce: true                  # chặn dò/chọn/trung bình seed và bỏ phiếu/ensemble nhiều mô hình
  require_evidence: true         # từ thí nghiệm thứ 2, `new-exp` phải có --evidence (quan sát làm căn cứ)
  require_prior_work: true       # từ thí nghiệm thứ 2 phải có prior_work.md (lời giải mạnh nhất đã công bố)
  base_seed: 42                  # seed của mọi lần chạy thường
  report_seeds: 3                # `labrat report-seeds`: số seed khi CHỐT kết quả (gồm seed gốc)
  max_report_seeds: 5
  max_report_experiments: 6      # chỉ cho phương pháp cuối, baseline mạnh nhất, ablation chính
  # forbid: {nhãn: regex}        # ghi đè danh sách mẫu bị chặn (mặc định trong policy.py)

stop:
  patience: 4                    # số thí nghiệm GPU liên tiếp không cải thiện thì dừng
  min_delta: 0.0005              # cải thiện nhỏ hơn mức này coi như không cải thiện
  target_score: null             # đạt điểm CV này thì dừng (null = không đặt)

poll_interval_minutes: 10

llm:                             # agent gọi model khác qua OpenRouter (`labrat llm`), key: OPENROUTER_API_KEY
  enabled: true
  per_call_usd: 0.5              # trần MỖI lần gọi (ước tính trước khi gọi)
  daily_usd: 3.0                 # trần mỗi ngày (UTC) cho `llm ask`; batch đã duyệt dùng ngân sách riêng
  monthly_usd: 30.0              # trần mỗi tháng
  max_tokens: 4000               # output tối đa mặc định
  pdf_engine: cloudflare-ai      # model không đọc PDF trực tiếp: cloudflare-ai (miễn phí) | mistral-ocr (PDF scan, có phí)
  deny_models: []                # vd ["openai/o1-pro"] để chặn model quá đắt
  data_collection: deny          # chỉ dùng nhà cung cấp KHÔNG lưu/huấn luyện trên dữ liệu gửi đi (allow = mọi nhà)
  batch_auto_usd: 2.0            # batch ước tính lớn hơn → dừng sau vài dòng chạy thử, chờ người dùng duyệt
  batch_workers: 4               # số yêu cầu song song khi chạy batch

outputs:                         # giữ ổ đĩa VPS không bị đầy bởi output kernel
  kernel_max_file_mb: 200        # trong kernel: file lớn hơn bị chuyển khỏi /kaggle/working (không thành output)
                                 #   giữ lại file cụ thể bằng job.yaml `keep_outputs: ["best_model.pt"]`
  download_max_file_mb: 50       # trên VPS: file output tải về lớn hơn bị xoá
  # fetch_pattern: ...           # regex file được tải về (mặc định: metrics/log/csv/ảnh/oof). job.yaml
                                 #   `fetch_outputs: "regex"` thêm file cho một thí nghiệm

disk:
  auto_clean_free_gb: 5          # ổ còn ít hơn → cron tự chạy `labrat clean`
  warn_free_gb: 5                # vẫn ít hơn sau khi dọn → cảnh báo Telegram (tối đa 6 giờ/lần)

downloads:                       # tải dữ liệu từ link gửi qua Telegram
  max_gb: 50                     # giới hạn mỗi lần tải (còn kiểm tra dung lượng ổ trống)

telegram:
  enabled: true                  # token & chat id đặt trong .env

paths:
  competitions_dir: competitions
  # Thư mục thả dữ liệu: mỗi thư mục con = một bộ dữ liệu/dự án (kèm task.md mô tả bài toán).
  # Đường dẫn tương đối tính từ thư mục project; có thể đặt tuyệt đối, vd /home/labrat/labrat-dropbox
  dropbox: dropbox
